apply plugin: 'com.android.application'

// Release signing. Never commit a keystore or its passwords: this reads them
// from android/keystore.properties (local, gitignored) or, failing that, from
// environment variables (CI secrets). With neither present the release build
// simply stays unsigned, so debug builds keep working on a clean checkout.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingStorePath = keystoreProps['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePass = keystoreProps['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias  = keystoreProps['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPass   = keystoreProps['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasSigning = signingStorePath && file(signingStorePath).exists() &&
                 signingStorePass && signingKeyAlias && signingKeyPass

// Resolved out here on purpose. Written inline as `versionCode (expr).toX()`,
// Groovy reads the space before the bracket as a call to the DSL setter and
// then chains onto its return value, which is null.
// Overridable from CI: -PversionCode=5 -PversionName=1.1. Play rejects an
// upload whose versionCode isn't higher than the previous one.
def appVersionCode = (project.findProperty("versionCode") ?: "1").toString().toInteger()
def appVersionName = (project.findProperty("versionName") ?: "1.0").toString()

android {
    namespace = "com.jamm87.dubsiren"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        // Only declared when the material is actually there, so an unsigned
        // build has no half-populated config lying around.
        if (hasSigning) {
            release {
                storeFile file(signingStorePath)
                storePassword signingStorePass
                keyAlias signingKeyAlias
                keyPassword signingKeyPass
            }
        }
    }

    defaultConfig {
        applicationId "com.jamm87.dubsiren"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
