name: Build Dub Siren (Android APK)

on:
  push:
    branches: [main]
    paths: ["android/**", "www/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DubSiren.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Dub Siren — Android (latest build)"
          body: |
            Auto-built from `main` (commit ${{ github.sha }}).
            Debug-signed APK — install directly on your phone, no Google Play needed.
            Requires Android 7.0 (API 24) or newer.
          files: DubSiren.apk
