name: Release Dub Siren (signed AAB for Play Store)

# Fires when you push a version tag, e.g.:
#   git tag v1.1 && git push origin v1.1
# The tag's number becomes versionName, and the run number becomes versionCode
# (Play requires versionCode to increase with every upload).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name shown in Play (e.g. 1.1)"
        required: true
        default: "1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx cap sync android

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.versionName }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Monotonic and never reused, which is all Play asks of versionCode.
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64. See docs/PLAY_STORE.md step 3."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -PversionCode=${{ steps.v.outputs.code }} \
            -PversionName=${{ steps.v.outputs.name }}

      - name: Confirm the bundle really is signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::No AAB produced"; exit 1; }
          # An unsigned bundle has no META-INF signature block; Play would reject it.
          if ! unzip -l "$AAB" | grep -qiE "META-INF/.*\.(RSA|EC|DSA)"; then
            echo "::error::AAB is not signed — check the ANDROID_* secrets."
            exit 1
          fi
          cp "$AAB" DubSiren-${{ steps.v.outputs.name }}.aab
          echo "Signed AAB ready: DubSiren-${{ steps.v.outputs.name }}.aab"

      - name: Attach the bundle to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Dub Siren ${{ steps.v.outputs.name }}"
          body: |
            Signed Android App Bundle for Google Play.

            - versionName: `${{ steps.v.outputs.name }}`
            - versionCode: `${{ steps.v.outputs.code }}`

            Download `DubSiren-${{ steps.v.outputs.name }}.aab` and upload it in
            Play Console → Production → Create new release.
            Sideloadable APKs stay on the `android-latest` release.
          files: DubSiren-${{ steps.v.outputs.name }}.aab
